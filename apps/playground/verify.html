<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shard Playground: verification fixture (0062)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111318; color: #d8dce6; font: 13px system-ui, sans-serif; overflow: hidden; }
      #table { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* DOM drawn over the canvas: page-scope captures include it, canvas-scope ones don't. */
      #bar { position: fixed; left: 0; right: 0; top: 0; height: 32px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: rgba(20, 23, 30, 0.9); border-bottom: 1px solid #2a2f3b; z-index: 3; }
      #labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      .label { position: absolute; transform: translate(-50%, -100%); padding: 1px 6px; border-radius: 3px; background: rgba(12, 14, 20, 0.8); color: #f0e6c8; font: 600 11px system-ui, sans-serif; white-space: nowrap; }
      /* The dice: a transparent surface over the table's corner (0052). */
      #dice { position: fixed; right: 16px; bottom: 16px; width: 320px; height: 220px; pointer-events: none; z-index: 4; }
    </style>
  </head>
  <body>
    <canvas id="table"></canvas>
    <div id="labels"></div>
    <div id="bar"><strong>Verification fixture</strong><span id="role"></span><span id="scene"></span></div>
    <canvas id="dice"></canvas>
    <script type="module" src="/src/verify.ts"></script>
  </body>
</html>
