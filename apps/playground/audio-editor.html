<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shard · Embeddable audio editor</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui,sans-serif; background: #10141c; color: #e0e8f4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #a5b4c8; max-width: 85ch; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; align-items: center; }
    button,select,input { font: inherit; }
    .docks { display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; }
    .dock { resize:both; overflow:auto; width:min(100%,900px); height:720px; min-width:300px; min-height:260px; max-width:100%; border:1px solid #42536d; border-radius:10px; }
    #compact { width:300px; height:560px; }
    #status { min-height:24px; }
    @media(max-width:340px) { body {padding:0;} }
  </style>
</head>
<body>
  <h1>Audio authoring, in your own dock</h1>
  <p>Drag either panel’s lower corner to resize. This host provides its own asset catalog and revisioned documents. Playback starts only when you press Play. No account or project server required.</p>
  <div class="controls">
    <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <button id="narrow" type="button">300 px panels</button>
    <button id="wide" type="button">Wide workspace</button>
    <label>Example <select id="example"></select></label>
    <button id="download" type="button">Download document JSON</button>
  </div>
  <div id="status" role="status">Loading host catalog…</div>
  <div class="docks"><div id="full" class="dock"></div><div id="compact" class="dock"></div></div>
  <script type="module" src="/src/audio-editor.ts"></script>
</body>
</html>
