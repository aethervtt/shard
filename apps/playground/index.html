<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shard Playground</title>
    <style>
      html, body { margin: 0; height: 100%; background: #030306; color: #cfd6e4; font: 12px ui-monospace, monospace; }
      #viewport { display: block; width: 100%; height: 100%; }
      #fps-graph { display: block; margin: 0 0 8px; border-radius: 3px; }
      #panel { position: fixed; top: 10px; left: 12px; background: rgba(8, 10, 16, 0.7); padding: 10px 12px; border-radius: 6px; }
      #hud { margin: 0 0 8px; white-space: pre; }
      button { font: inherit; color: inherit; background: #1a1f2b; border: 1px solid #2c3445; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      button:hover { background: #242b3a; }
      body:not([data-demo='galaxy']) [data-change] { display: none; }
      body:not([data-demo='prefabs']) [data-prefab] { display: none; }
      body:not([data-demo='data']) [data-weapon] { display: none; }
      nav { margin-top: 8px; opacity: 0.75; }
      nav a { color: inherit; margin-right: 10px; }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="panel">
      <pre id="hud">starting…</pre>
      <canvas id="fps-graph"></canvas>
      <button type="button" data-change="-50000">−50k</button>
      <button type="button" data-change="-10000">−10k</button>
      <button type="button" data-change="10000">+10k</button>
      <button type="button" data-change="50000">+50k</button>
      <button type="button" data-prefab="spawn">1 spawn 500</button>
      <button type="button" data-prefab="edit">2 edit prefab</button>
      <button type="button" data-prefab="apply">3 apply drone-b</button>
      <button type="button" data-prefab="reset">4 reset</button>
      <button type="button" data-weapon="overcharge">1 overcharge laser</button>
      <button type="button" data-weapon="heavy">2 edit heavy</button>
      <button type="button" data-weapon="script">3 reload script</button>
      <button type="button" data-weapon="break">4 break scatter</button>
      <button type="button" data-weapon="reset">5 reset</button>
      <nav><a href="#scene">scene</a><a href="#galaxy">galaxy</a><a href="#lights">lights</a><a href="#ibl">ibl</a><a href="#sky">sky</a><a href="#deferred">deferred</a><a href="#crowd">crowd</a><a href="#post">post</a><a href="#sprites">sprites</a><a href="#particles">particles</a><a href="#physics">physics</a><a href="#planet">planet</a><a href="#physics2d">physics2d</a><a href="#character">character</a><a href="#character-planet">character-planet</a><a href="#character2d">character2d</a><a href="#prefabs">prefabs</a><a href="#data">data</a></nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
