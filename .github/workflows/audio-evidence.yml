name: Audio evidence

on:
  pull_request:
    paths:
      - 'packages/audio/**'
      - 'packages/dice/**'
      - 'apps/playground/src/dice*'
      - 'specs/0084*'
      - 'packages/audio-editor/**'
      - 'packages/audio-preview/**'
      - 'packages/platform*/**'
      - 'packages/assets/**'
      - 'packages/save/**'
      - 'packages/project/**'
      - 'packages/testing/**'
      - 'apps/playground/src/audio*'
      - 'apps/cli/**'
      - 'examples/audio-lab/**'
      - 'bench/perf/budgets.json'
      - '.github/workflows/audio-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'packages/audio/**'
      - 'packages/dice/**'
      - 'apps/playground/src/dice*'
      - 'specs/0084*'
      - 'packages/audio-editor/**'
      - 'packages/audio-preview/**'
      - 'packages/platform*/**'
      - 'packages/assets/**'
      - 'packages/save/**'
      - 'packages/project/**'
      - 'packages/testing/**'
      - 'apps/playground/src/audio*'
      - 'apps/cli/**'
      - 'examples/audio-lab/**'
      - 'bench/perf/budgets.json'
      - '.github/workflows/audio-evidence.yml'
  workflow_dispatch:

concurrency:
  group: audio-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signal:
    name: Browser audio signals and correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aethervtt/shard-playground exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: pnpm --filter audio-lab check
      - run: pnpm lint
      - run: pnpm --filter @aethervtt/shard-audio --filter @aethervtt/shard-assets --filter @aethervtt/shard-save test
        env:
          SHARD_CI: '1'
      - run: pnpm --filter @aethervtt/shard-playground exec vitest run src/audio.test.ts src/dice-audio.test.ts
        env:
          SHARD_BROWSER_TESTS: required
          SHARD_AUDIO_EVIDENCE: ${{ github.workspace }}/audio-evidence
      - run: pnpm --filter @aethervtt/shard-cli exec vitest run src/audio-preview.test.ts
        env:
          SHARD_BROWSER_TESTS: 'required'
          SHARD_AUDIO_EVIDENCE: ${{ github.workspace }}/audio-evidence
      - run: pnpm --filter @aethervtt/shard-cli exec vitest run src/audio-project.test.ts
        env:
          SHARD_AUDIO_PROJECT_TESTS: 'required'
          SHARD_CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-signals-${{ github.sha }}
          path: audio-evidence/
          if-no-files-found: warn
  performance:
    name: Audio performance measurements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Hosted hardware is reported honestly by 0075. It is not labeled as either named machine.
      - run: pnpm bench --filter=@aethervtt/shard-audio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-performance-${{ github.sha }}
          path: bench/perf/report.json
          if-no-files-found: warn
  dice:
    name: Dice audio integration and performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: pnpm bench --filter=@aethervtt/shard-dice -- src/audio.test.ts src/audio-assets.test.ts src/table.test.ts src/entrances.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-audio-performance-${{ github.sha }}
          path: bench/perf/report.json
          if-no-files-found: error
  packaging:
    name: Build and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: oven-sh/setup-bun@v2
      - run: pnpm build
      - run: pnpm size --check
      - name: Install Chromium for the packed consumer
        run: pnpm --filter @aethervtt/shard-playground exec playwright install --with-deps chromium
      - run: pnpm release --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-package-${{ github.sha }}
          path: bench/size/report.json
          if-no-files-found: warn
