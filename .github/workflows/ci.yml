name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Turbo's cache: packages whose inputs didn't change replay their last result.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-

      - run: pnpm typecheck

  test:
    name: Test ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # GPU tests run on Dawn in Node, which needs a Vulkan driver: Mesa's software one (lavapipe).
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - run: pnpm install --frozen-lockfile

      # One cache per runner: each holds the results of the files that runner ran.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.shard }}-

      # SHARD_CI: correctness only. Shared runners render on a software GPU, so time budgets are off
      # there and timeouts are 5x (see packages/core/src/test-env.ts); `pnpm bench` holds the budgets.
      # SHARD_TEST_SHARD: this runner's share of the test files (scripts/test-shard.mjs). The
      # examples run through `shard test`, which doesn't split, so they run on runner 1 only. The
      # playground's browser tests run in the browser job.
      # --continue: report every failing package, not just the first.
      - name: Run this runner's tests
        run: |
          if [ "${{ matrix.shard }}" = 1 ]; then
            pnpm test --continue --filter='!@aethervtt/shard-playground'
          else
            pnpm test --continue --filter='!./examples/*' --filter='!@aethervtt/shard-playground'
          fi
        env:
          SHARD_CI: '1'
          SHARD_TEST_SHARD: ${{ matrix.shard }}/4

  # The same tests on Windows: paths, drive letters, and .cmd shims break there and nowhere else.
  # Hosted Windows runners have no GPU; Dawn renders on WARP, D3D12's software rasterizer.
  test-windows:
    name: Test Windows ${{ matrix.shard }}/4
    runs-on: windows-latest
    # WARP rasterizes on the runner's 4 cores; tighten once real run times are known.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-windows-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-test-windows-${{ matrix.shard }}-

      # As the Linux runners, with SHARD_DAWN_OPTIONS naming the adapter: a runner that has no WARP
      # fails at the first GPU test instead of quietly rendering on something else.
      - name: Run this runner's tests
        run: |
          if [ "${{ matrix.shard }}" = 1 ]; then
            pnpm test --continue --filter='!@aethervtt/shard-playground'
          else
            pnpm test --continue --filter='!./examples/*' --filter='!@aethervtt/shard-playground'
          fi
        env:
          SHARD_CI: '1'
          SHARD_TEST_SHARD: ${{ matrix.shard }}/4
          SHARD_DAWN_OPTIONS: adapter=Microsoft Basic Render Driver

  browser:
    name: Browser tests (software GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # WebGPU in Chromium through Mesa's software Vulkan driver (lavapipe), with the browser headed
      # under a virtual display: how three.js runs its WebGPU tests on hosted runners.
      - name: Install a software Vulkan driver and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @aethervtt/shard-playground exec playwright install --with-deps chromium

      # 0062's criteria in real Chromium (apps/playground/src/verify.test.ts). SHARD_BROWSER_TESTS:
      # a missing adapter fails the job instead of skipping the tests. Timing checks hold under
      # `pnpm bench` only, as everywhere else in CI.
      - name: Run the browser tests
        run: xvfb-run -a pnpm --filter @aethervtt/shard-playground test
        env:
          SHARD_CI: '1'
          SHARD_BROWSER_TESTS: required
          SHARD_BROWSER_HEADED: '1'
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
